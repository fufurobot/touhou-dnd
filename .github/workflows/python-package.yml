# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
    - name: Setup uv
      # You may pin to the exact commit or the version.
      # uses: yezz123/setup-uv@ab6be5a42627f19dc36e57b548592a5e52cece4a
      uses: yezz123/setup-uv@v4.1
      # with:
      #   # uv version to use. If not provided, the latest stable version will be used.
      #   uv-version: # optional
      #   # Virtual environment name to create and activate.
      #   uv-venv: # optional
      #   # Whether to cache uv packages. Only supported for uv versions >= 0.3.0.
      #   uv-cache: # optional, default is false
      #   # Directory to use for uv cache. If not specified, a platform-appropriate default will be used.
      #   uv-cache-dir: # optional          
    - name: Set up Python ${{ matrix.python-version }} and Install dev dependencies
      run: |
        echo ${{ matrix.python-version }} > .python-version
        uv sync
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest
